<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AttendEasy — Attendance that takes seconds</title>

    <meta
      name="description"
      content="AttendEasy makes attendance quick and reliable. Open a lecture session, share one code, and every student marks themselves in seconds."
    />
    <meta
      name="keywords"
      content="attendance app, college attendance, digital attendance, student attendance, attendance software"
    />
    <meta name="author" content="AttendEasy" />

    <link rel="canonical" href="https://attendeasy.in" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1219" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="AttendEasy — Attendance that takes seconds" />
    <meta
      property="og:description"
      content="Open a lecture session, share one code, and the whole class marks itself in seconds."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://attendeasy.in" />
    <meta property="og:image" content="https://attendeasy.in/images/og-banner.png" />
    <meta property="og:site_name" content="AttendEasy" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AttendEasy — Attendance that takes seconds" />
    <meta
      name="twitter:description"
      content="Open a lecture session, share one code, and the whole class marks itself in seconds."
    />
    <meta name="twitter:image" content="https://attendeasy.in/images/og-banner.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("attendeasy.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (error) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
