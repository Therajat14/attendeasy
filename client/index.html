<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AttendEasy — QR Attendance That Takes Seconds, Not Minutes</title>

    <meta
      name="description"
      content="A QR attendance app for colleges. Start a lecture, show one code, and the class marks itself in seconds. Live rosters, auto-expiry, per-student history."
    />
    <meta name="author" content="AttendEasy" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- One canonical URL so search engines do not treat copies as duplicates. -->
    <link rel="canonical" href="https://attendeasy.in/" />

    <!-- Icons. Sizes are declared honestly so the browser can pick the right one. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1219" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: how the link looks when shared on Facebook, LinkedIn, WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AttendEasy" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://attendeasy.in/" />
    <meta property="og:title" content="AttendEasy — QR Attendance That Takes Seconds" />
    <meta
      property="og:description"
      content="Open a lecture session, share one code, and the whole class marks itself in seconds."
    />
    <meta property="og:image" content="https://attendeasy.in/images/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AttendEasy — a QR code attendance app for colleges"
    />

    <!-- Twitter/X uses the same image but wants its own alt text field. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AttendEasy — QR Attendance That Takes Seconds"
    />
    <meta
      name="twitter:description"
      content="Open a lecture session, share one code, and the whole class marks itself in seconds."
    />
    <meta name="twitter:image" content="https://attendeasy.in/images/og-banner.png" />
    <meta
      name="twitter:image:alt"
      content="AttendEasy — a QR code attendance app for colleges"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("attendeasy.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (error) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
