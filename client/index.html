<!doctype html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>AttendEasy | Smart QR Attendance System</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="AttendEasy is a smart QR-based attendance system that prevents proxy attendance and enables real-time presence tracking for colleges, offices, and events."
    />

    <meta
      name="keywords"
      content="QR attendance system, college attendance app, proxy attendance solution, digital attendance, AttendEasy"
    />

    <meta name="author" content="AttendEasy" />

    <!-- Canonical -->
    <link rel="canonical" href="https://attendeasy.in" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph SEO -->
    <meta property="og:title" content="AttendEasy - QR Attendance Platform" />
    <meta
      property="og:description"
      content="Fast, secure, and proxy-free attendance using QR codes and smart verification."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://attendeasy.in" />
    <meta
      property="og:image"
      content="https://attendeasy.in/images/og-banner.png"
    />
    <meta property="og:site_name" content="AttendEasy" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AttendEasy Attendance System" />
    <meta
      name="twitter:description"
      content="Smart QR attendance and presence verification platform."
    />
    <meta
      name="twitter:image"
      content="https://attendeasy.in/images/og-banner.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
